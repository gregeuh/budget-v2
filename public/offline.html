<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F2F2F7" />
    <title>Pécule — Hors connexion</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f2f2f7; color: #17203a; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 340px; background: #fff; border-radius: 24px; padding: 28px 22px; box-shadow: 0 12px 32px rgba(35, 45, 80, .12); }
      .mark { color: #fff; background: linear-gradient(135deg, #5a51df, #8b5cf6); width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; margin: 0 auto 16px; font-size: 26px; font-weight: 700; }
      h1 { margin: 0; font-size: 22px; } p { color: #65708c; line-height: 1.5; } button { width: 100%; border: 0; border-radius: 14px; padding: 13px; background: #5a51df; color: #fff; font: inherit; font-weight: 650; }
    </style>
  </head>
  <body><main><div class="mark">P</div><h1>Tu es hors connexion</h1><p>Reconnecte-toi pour charger cette page. Les pages déjà consultées restent disponibles dans Pécule.</p><button onclick="location.reload()">Réessayer</button></main></body>
</html>
